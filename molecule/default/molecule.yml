---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: molecule-coturn-debian${MOLECULE_DEBIAN_VERSION:-11}
    image: wazoplatform/systemd-debian:${MOLECULE_DEBIAN_VERSION:-11}
    privileged: True
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns_mode: host
    command: /lib/systemd/systemd
    groups:
      - molecule_coturn
    networks:
      - name: molecule-coturn
  - name: molecule-coturn-stun-client
    image: node:lts-slim
    networks:
      - name: molecule-coturn
provisioner:
  name: ansible
  log: true
verifier:
  name: testinfra
  options:
    tb: short
